name: Déploiement Cloudflare

# Publie l'application (front + API) à chaque nouveau tag (ex. `git tag v1.0.0 && git push origin v1.0.0`).
# Lancement manuel possible depuis l'onglet Actions. Mise en place : docs/deploiement.md.
on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Version de pnpm lue dans le champ `packageManager` du package.json racine.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}

      # Migrations D1 d'abord : le nouveau code peut dépendre du nouveau schéma.
      - run: pnpm --filter @axomaster/api db:migrate:remote
      - run: pnpm --filter @axomaster/api release
